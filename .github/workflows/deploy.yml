name: Test & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплои идут строго по очереди; начатый не отменяется
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # DEPLOY_KNOWN_HOSTS — строка known_hosts сервера («хост тип ключ»): подключаемся, только если
      # хост тот самый. Адрес сервера берётся из первого поля этой же строки
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Нужны секреты DEPLOY_SSH_KEY и DEPLOY_KNOWN_HOSTS"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          host=$(printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | awk 'NR==1 {print $1}')
          echo "::add-mask::$host"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"

      # На сервере ключ привязан к deploy/deploy.sh (forced command): секреты уходят в stdin,
      # скрипт обновляет .env, код, собирает и перезапускает бота
      - name: Deploy
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        # Пустые секреты (например, VK ещё не настроен) скрипт на сервере пропускает
        run: |
          printf 'BOT_TOKEN=%s\nVK_TOKEN=%s\nVK_GROUP_ID=%s\nYANDEX_API_KEY=%s\nYANDEX_FOLDER_ID=%s\n' \
            "$BOT_TOKEN" "$VK_TOKEN" "$VK_GROUP_ID" "$YANDEX_API_KEY" "$YANDEX_FOLDER_ID" \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST"
